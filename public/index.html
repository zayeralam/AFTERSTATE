<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AFTERSTATE local commitment accountability dashboard"><title>AFTERSTATE</title><link rel="stylesheet" href="style.css"></head><body><aside aria-label="Brand"><b>A<span>.</span></b></aside><main><header><div><small>OPERATIONS / PERSONAL SYSTEM</small><h1>AFTERSTATE</h1></div><div class="head-actions"><button id="export">Export data</button><button id="new">＋ New commitment</button></div></header><section class="hero"><small>THE CURRENT STATE</small><h2>Make the aftermath<br>accountable.</h2><p>Track what was promised. See what is moving. Recover what is at risk.</p></section><section id="stats" class="stats" aria-live="polite"></section><section class="bar"><h2>Commitment ledger</h2><input id="search" placeholder="Search records" aria-label="Search records"><select id="filter" aria-label="Filter status"><option value="all">All</option><option>open</option><option>in_progress</option><option>blocked</option><option>done</option></select></section><div id="list" aria-live="polite"></div><section class="columns"><div class="panel"><h3>Recovery queue</h3><div id="risklist"></div></div><div class="panel"><h3>Activity trail</h3><div id="events"></div></div></section><footer>AFTERSTATE · Local prototype · Keep this service on your own device</footer></main><dialog id="dlg"><form id="form"><h2>Commitment</h2><input type="hidden" id="id"><label>Title<input id="title" required maxlength="500"></label><label>Context<textarea id="description" maxlength="4000"></textarea></label><div class="two"><label>Owner<input id="owner" maxlength="120"></label><label>Due date<input type="date" id="dueDate"></label></div><div class="two"><label>Priority<select id="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label><label>Status<select id="status"><option>open</op
